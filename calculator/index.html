<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneySutra — Investment Calculators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#0B2545;
    --ink-2:#12305C;
    --ink-3:#1A3C6E;
    --paper:#F2ECDD;
    --paper-2:#E9E1CC;
    --gold:#C99A3D;
    --gold-bright:#E3B85C;
    --green:#2F8F5B;
    --rose:#B5484B;
    --ink-text:#1B2338;
    --muted:#93A0BE;
    --muted-2:#5C6785;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #12305C 0%, #0B2545 55%, #081A33 100%);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .app{max-width:1080px;margin:0 auto;}

  /* Topbar: navigation back to main site */
  .topbar{
    max-width:1080px;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(242,236,221,0.06);
    border:1px solid rgba(242,236,221,0.15);
    border-radius:12px;
    padding:10px 16px;
  }
  .topbar a{
    color:var(--paper);
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
  }
  .topbar a:hover{color:var(--gold-bright);}
  .topbar .home-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .topbar .top-actions{display:flex;gap:10px;align-items:center;}
  .topbar .top-actions a.wa{
    background:var(--green);color:#fff;padding:7px 14px;border-radius:18px;font-size:12.5px;
  }
  .topbar .top-actions a.wa:hover{filter:brightness(1.08);color:#fff;}
  @media(max-width:640px){
    .topbar{padding:9px 12px;}
    .topbar a{font-size:12px;}
  }

  /* Masthead */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:28px;border-bottom:1px solid rgba(242,236,221,0.15);padding-bottom:18px;}
  .brand-block{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
  .brand-logo{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,0.35));}
  .brand-sub{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:14px;color:var(--gold-bright);}
  .masthead-right{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1.5px;}

  /* Tabs styled like passbook index tabs */
  .tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:0;padding:0 4px;}
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:0.5px;text-transform:uppercase;
    background:var(--ink-2);
    color:var(--muted);
    border:1px solid rgba(242,236,221,0.12);
    border-bottom:none;
    padding:10px 18px 12px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    transform:translateY(6px);
    transition:transform .18s ease, background .18s ease, color .18s ease;
  }
  .tab:hover{color:var(--paper);}
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    transform:translateY(0);
    font-weight:600;
    border-color:transparent;
  }

  .layout{
    background:var(--paper);
    border-radius:4px 14px 14px 14px;
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:0;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }
  @media(max-width:760px){.layout{grid-template-columns:1fr;}}

  /* Inputs panel */
  .inputs-panel{
    padding:32px 30px;
    color:var(--ink-text);
    border-right:1px dashed rgba(27,35,56,0.2);
  }
  @media(max-width:760px){.inputs-panel{border-right:none;border-bottom:1px dashed rgba(27,35,56,0.2);}}
  .panel-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 4px;}
  .panel-desc{font-size:13px;color:#6b7590;margin:0 0 24px;line-height:1.5;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:600;color:#3c4560;margin-bottom:8px;}
  .field input[type=range]{
    width:100%;height:4px;-webkit-appearance:none;background:var(--paper-2);border-radius:4px;outline:none;
  }
  .field input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--gold);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--gold);cursor:pointer;margin-top:-1px;
  }
  .amount-box{display:flex;align-items:center;gap:0;margin-top:9px;background:#fff;border:1px solid #d9d2ba;border-radius:6px;overflow:hidden;}
  .amount-box .ab-affix{padding:8px 8px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#8a93a6;background:var(--paper-2);flex:0 0 auto;}
  .amount-box input[type=number]{
    width:100%;padding:8px 10px;border:none;outline:none;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;background:#fff;color:var(--ink-text);
    -moz-appearance:textfield;
  }
  .amount-box input[type=number]::-webkit-outer-spin-button,
  .amount-box input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:#3c4560;}
  .checkbox-row input{accent-color:var(--gold);width:15px;height:15px;}
  .toggle-field{margin:4px 0 18px;padding-bottom:16px;border-bottom:1px dashed rgba(27,35,56,0.15);}
  .dependent-field{background:var(--paper-2);border-radius:10px;padding:14px 16px 2px;margin:-4px 0 20px;}

  /* Passbook panel */
  .passbook-panel{
    background:linear-gradient(180deg, #FBF8F0 0%, #F2ECDD 100%);
    padding:30px 32px 24px;
    position:relative;
  }
  .seal-wrap{display:flex;justify-content:flex-end;margin-top:-8px;margin-bottom:-30px;position:relative;z-index:2;}
  .seal{width:92px;height:92px;opacity:0.9;transform:rotate(-8deg);}

  .ledger-rows{margin-top:8px;}
  .row{display:flex;align-items:baseline;padding:10px 0;border-bottom:1px dotted rgba(27,35,56,0.25);}
  .row .label{font-size:13px;color:#5c6785;flex:0 0 auto;white-space:nowrap;}
  .row .dots{flex:1;}
  .row .amount{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;color:var(--ink-text);white-space:nowrap;}
  .row .amount.green{color:var(--green);}
  .row .amount.rose{color:var(--rose);}
  .row.total{border-bottom:none;padding-top:16px;}
  .row.total .label{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--ink-text);}
  .row.total .amount{font-size:26px;color:var(--ink);}
  .sub-note{font-size:11.5px;color:#8a93a6;margin-top:-4px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}

  .chart-wrap{margin-top:18px;background:#fff;border-radius:10px;border:1px solid rgba(27,35,56,0.08);padding:14px 14px 6px;}
  .chart-wrap canvas{max-height:220px;}
  .legend{display:flex;gap:18px;margin-top:8px;font-size:11.5px;color:#5c6785;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}

  .warn{background:#fbeceb;border:1px solid #eecbc8;color:var(--rose);font-size:12.5px;padding:8px 12px;border-radius:6px;margin-top:14px;}

  /* Breakdown table */
  .breakdown{margin-top:22px;}
  .toggle-btn{
    background:none;border:1px solid rgba(242,236,221,0.25);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.5px;
    padding:9px 16px;border-radius:20px;cursor:pointer;text-transform:uppercase;
  }
  .toggle-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .table-wrap{overflow-x:auto;margin-top:14px;border-radius:10px;overflow:hidden;display:none;}
  .table-wrap.show{display:block;}
  table{width:100%;border-collapse:collapse;background:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  th,td{padding:9px 14px;text-align:right;color:var(--ink-text);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  th{background:var(--ink-3);color:var(--paper);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:0.6px;position:sticky;top:0;}
  tr:nth-child(even){background:var(--paper-2);}

  /* Footer */
  footer{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--gold);color:var(--ink);border:none;padding:11px 20px;border-radius:24px;cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{background:var(--gold-bright);transform:translateY(-1px);}
  .btn.ghost{background:transparent;border:1px solid rgba(242,236,221,0.3);color:var(--paper);}
  .btn.ghost:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
  .disclaimer{font-size:11.5px;color:var(--muted-2);max-width:520px;line-height:1.5;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--gold);color:var(--ink);padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
/* ---------- Utilities ---------- */
function fmtINR(n, decimals=0){
  if(!isFinite(n)) n = 0;
  const sign = n<0 ? '-' : '';
  n = Math.abs(n);
  return sign + '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:decimals, minimumFractionDigits:decimals});
}
function humanize(n){
  const abs = Math.abs(n);
  if(abs >= 1e7) return '≈ ' + (n/1e7).toFixed(2) + ' Cr';
  if(abs >= 1e5) return '≈ ' + (n/1e5).toFixed(2) + ' L';
  return '';
}
function animateValue(el, from, to, dur=500){
  const start = performance.now();
  function step(t){
    const p = Math.min(1, (t-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (to-from)*eased;
    el.textContent = fmtINR(Math.round(val));
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- Tab config ---------- */
const TABS = {
  sip:{
    title:'SIP Calculator',
    desc:'See how a fixed monthly investment grows over time with compounding returns.',
    fields:[
      {id:'monthly', label:'Monthly investment', type:'range', min:500, max:200000, step:100, value:10000, prefix:'₹'},
      {id:'rate', label:'Expected annual return', type:'range', min:1, max:30, step:0.5, value:12, suffix:'%'},
      {id:'years', label:'Investment period', type:'range', min:1, max:40, step:1, value:15, suffix:' yrs'},
      {id:'stepupEnabled', type:'toggle', label:'Increase my SIP every year (step-up)', value:false},
      {id:'stepup', label:'Annual step-up', type:'range', min:1, max:30, step:1, value:10, suffix:'%', dependsOn:'stepupEnabled'},
    ]
  },
  combo:{
    title:'SIP + Lumpsum Calculator',
    desc:'Set a one-time lumpsum and a recurring monthly SIP together, and see them grow side by side.',
    fields:[
      {id:'monthly', label:'Monthly SIP investment', type:'range', min:0, max:200000, step:100, value:5000, prefix:'₹'},
      {id:'principal', label:'One-time lumpsum', type:'range', min:0, max:10000000, step:100, value:100000, prefix:'₹'},
      {id:'rate', label:'Expected annual return', type:'range', min:1, max:30, step:0.5, value:12, suffix:'%'},
      {id:'years', label:'Investment period', type:'range', min:1, max:40, step:1, value:15, suffix:' yrs'},
      {id:'stepupEnabled', type:'toggle', label:'Increase my SIP every year (step-up)', value:false},
      {id:'stepup', label:'Annual step-up on the SIP', type:'range', min:1, max:30, step:1, value:10, suffix:'%', dependsOn:'stepupEnabled'},
    ]
  },
  lumpsum:{
    title:'Lumpsum Calculator',
    desc:'Project the future value of a one-time investment.',
    fields:[
      {id:'principal', label:'Investment amount', type:'range', min:1000, max:10000000, step:100, value:100000, prefix:'₹'},
      {id:'rate', label:'Expected annual return', type:'range', min:1, max:30, step:0.5, value:12, suffix:'%'},
      {id:'years', label:'Investment period', type:'range', min:1, max:40, step:1, value:15, suffix:' yrs'},
      {id:'topupEnabled', type:'toggle', label:'Add a growing annual top-up (step-up)', value:false},
      {id:'topupAmount', label:'Top-up amount (from year 2)', type:'range', min:500, max:1000000, step:100, value:10000, prefix:'₹', dependsOn:'topupEnabled'},
      {id:'topupStepup', label:'Annual step-up on the top-up', type:'range', min:0, max:30, step:1, value:10, suffix:'%', dependsOn:'topupEnabled'},
    ]
  },
  swp:{
    title:'SWP Calculator',
    desc:'Plan regular monthly withdrawals from an existing corpus and see how long it lasts.',
    fields:[
      {id:'corpus', label:'Starting corpus', type:'range', min:10000, max:20000000, step:100, value:2000000, prefix:'₹'},
      {id:'withdrawal', label:'Monthly withdrawal', type:'range', min:500, max:300000, step:100, value:15000, prefix:'₹'},
      {id:'rate', label:'Expected annual return', type:'range', min:1, max:30, step:0.5, value:8, suffix:'%'},
      {id:'years', label:'Withdrawal period', type:'range', min:1, max:40, step:1, value:20, suffix:' yrs'},
    ]
  },
  goal:{
    title:'Goal Planner',
    desc:'Find the monthly SIP you need to reach a specific financial goal.',
    fields:[
      {id:'goal', label:'Target amount', type:'range', min:100000, max:100000000, step:100, value:5000000, prefix:'₹'},
      {id:'rate', label:'Expected annual return', type:'range', min:1, max:30, step:0.5, value:12, suffix:'%'},
      {id:'years', label:'Time to goal', type:'range', min:1, max:40, step:1, value:15, suffix:' yrs'},
      {id:'stepup', label:'Annual step-up (optional)', type:'range', min:0, max:30, step:1, value:0, suffix:'%'},
    ]
  }
};

let currentTab = 'sip';
let state = {}; // per-tab field values
let inflationOn = false;
let inflationRate = 6;
let chart;

/* init default state from field values + optional URL params */
function initState(){
  const params = new URLSearchParams(location.search);
  if(params.get('tab') && TABS[params.get('tab')]) currentTab = params.get('tab');
  Object.keys(TABS).forEach(t=>{
    state[t] = {};
    TABS[t].fields.forEach(f=> state[t][f.id] = f.value);
  });
  TABS[currentTab].fields.forEach(f=>{
    if(!params.has(f.id)) return;
    state[currentTab][f.id] = f.type==='toggle' ? params.get(f.id)==='1' : parseFloat(params.get(f.id));
  });
  if(params.get('infl')==='1'){ inflationOn = true; }
  if(params.get('inflRate')) inflationRate = parseFloat(params.get('inflRate'));
}

/* ---------- Render inputs ---------- */
function renderInputs(){
  const cfg = TABS[currentTab];
  const panel = document.getElementById('inputsPanel');
  let html = `<h2 class="panel-title">${cfg.title}</h2><p class="panel-desc">${cfg.desc}</p>`;

  cfg.fields.forEach(f=>{
    if(f.type==='toggle'){
      const checked = !!state[currentTab][f.id];
      html += `
        <div class="checkbox-row toggle-field">
          <input type="checkbox" id="toggle-${f.id}" data-toggle="${f.id}" ${checked?'checked':''}>
          <label for="toggle-${f.id}">${f.label}</label>
        </div>`;
      return;
    }
    const val = state[currentTab][f.id];
    const hidden = f.dependsOn && !state[currentTab][f.dependsOn];
    const wrapClass = f.dependsOn ? 'field dependent-field' : 'field';
    html += `
      <div class="${wrapClass}" data-fieldwrap="${f.id}" style="${hidden?'display:none;':''}">
        <label>${f.label}</label>
        <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" data-field="${f.id}">
        <div class="amount-box">
          ${f.prefix ? `<span class="ab-affix">${f.prefix}</span>` : ''}
          <input type="number" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" data-field-num="${f.id}">
          ${f.suffix ? `<span class="ab-affix">${f.suffix.trim()}</span>` : ''}
        </div>
      </div>`;
  });

  html += `
    <div class="checkbox-row">
      <input type="checkbox" id="inflToggle" ${inflationOn?'checked':''}>
      <label for="inflToggle">Adjust maturity value for inflation</label>
    </div>
    <div class="field" id="inflField" style="margin-top:12px; ${inflationOn?'':'display:none;'}">
      <label>Assumed inflation</label>
      <input type="range" min="1" max="12" step="0.5" value="${inflationRate}" id="inflRange">
      <div class="amount-box">
        <input type="number" min="1" max="12" step="0.5" value="${inflationRate}" id="inflNum">
        <span class="ab-affix">%</span>
      </div>
    </div>
  `;
  panel.innerHTML = html;

  /* sliders */
  panel.querySelectorAll('[data-field]').forEach(input=>{
    const id = input.dataset.field;
    input.addEventListener('input', (e)=>{
      const v = parseFloat(e.target.value);
      state[currentTab][id] = v;
      const numInput = panel.querySelector(`[data-field-num="${id}"]`);
      if(numInput) numInput.value = v;
      compute();
    });
  });

  /* typeable amount boxes */
  panel.querySelectorAll('[data-field-num]').forEach(input=>{
    const id = input.dataset.fieldNum;
    const cfgField = cfg.fields.find(f=>f.id===id);
    input.addEventListener('input', (e)=>{
      let v = parseFloat(e.target.value);
      if(isNaN(v)) return;
      if(cfgField){ v = Math.min(cfgField.max, Math.max(cfgField.min, v)); }
      state[currentTab][id] = v;
      const rangeInput = panel.querySelector(`[data-field="${id}"]`);
      if(rangeInput) rangeInput.value = v;
      compute();
    });
  });

  /* per-tab toggles (step-up / top-up) */
  panel.querySelectorAll('[data-toggle]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      state[currentTab][cb.dataset.toggle] = e.target.checked;
      renderInputs();
      compute();
    });
  });

  document.getElementById('inflToggle').addEventListener('change', (e)=>{
    inflationOn = e.target.checked;
    document.getElementById('inflField').style.display = inflationOn ? '' : 'none';
    compute();
  });
  document.getElementById('inflRange').addEventListener('input', (e)=>{
    inflationRate = parseFloat(e.target.value);
    document.getElementById('inflNum').value = inflationRate;
    compute();
  });
  document.getElementById('inflNum').addEventListener('input', (e)=>{
    let v = parseFloat(e.target.value);
    if(isNaN(v)) return;
    v = Math.min(12, Math.max(1, v));
    inflationRate = v;
    document.getElementById('inflRange').value = v;
    compute();
  });
}

/* ---------- Calculators ---------- */
function calcSIP(monthly, rateAnnual, years, stepUpPct=0){
  const r = rateAnnual/100/12;
  const months = years*12;
  let balance = 0, invested = 0;
  let currentMonthly = monthly;
  const yearly = [];
  for(let m=1; m<=months; m++){
    if(m>1 && (m-1)%12===0) currentMonthly = currentMonthly * (1+stepUpPct/100);
    balance = (balance + currentMonthly) * (1+r);
    invested += currentMonthly;
    if(m%12===0 || m===months){
      yearly.push({year: Math.ceil(m/12), invested: invested, value: balance});
    }
  }
  return {yearly, investedTotal: invested, valueTotal: balance};
}

function calcLumpsum(principal, rateAnnual, years, topupAmount=0, topupStepUpPct=0){
  const r = rateAnnual/100;
  let balance = principal;
  let invested = principal;
  let currentTopup = topupAmount;
  const yearly = [];
  for(let y=1; y<=years; y++){
    if(y>1 && topupAmount>0){
      balance += currentTopup;
      invested += currentTopup;
      currentTopup = currentTopup*(1+topupStepUpPct/100);
    }
    balance = balance*(1+r);
    yearly.push({year:y, invested, value: balance});
  }
  return {yearly, investedTotal: invested, valueTotal: yearly.length? yearly[yearly.length-1].value : principal};
}

function calcCombo(monthly, principal, rateAnnual, years, stepUpPct=0){
  const sipRes = calcSIP(monthly, rateAnnual, years, stepUpPct);
  const lumpRes = calcLumpsum(principal, rateAnnual, years);
  const yearly = sipRes.yearly.map((y, i)=>({
    year: y.year,
    invested: y.invested + (lumpRes.yearly[i] ? lumpRes.yearly[i].invested : principal),
    value: y.value + (lumpRes.yearly[i] ? lumpRes.yearly[i].value : principal)
  }));
  const investedTotal = sipRes.investedTotal + principal;
  const valueTotal = sipRes.valueTotal + lumpRes.valueTotal;
  return {yearly, investedTotal, valueTotal, sipValue: sipRes.valueTotal, lumpValue: lumpRes.valueTotal};
}

function calcSWP(corpus, withdrawal, rateAnnual, years){
  const r = rateAnnual/100/12;
  let balance = corpus;
  let totalWithdrawn = 0;
  const yearly = [];
  let depletedAt = null;
  const months = years*12;
  for(let m=1; m<=months; m++){
    balance = balance*(1+r) - withdrawal;
    totalWithdrawn += withdrawal;
    if(balance <= 0 && depletedAt===null){ depletedAt = m; balance = 0; }
    if(m%12===0 || m===months){
      yearly.push({year:Math.ceil(m/12), invested: totalWithdrawn, value: Math.max(balance,0)});
    }
    if(depletedAt!==null) {
      // fill remaining years with 0 balance for chart consistency
    }
  }
  return {yearly, investedTotal: totalWithdrawn, valueTotal: Math.max(balance,0), depletedAt, corpus};
}

function requiredSIPForGoal(goal, rateAnnual, years, stepUpPct=0){
  const r = rateAnnual/100/12;
  const months = years*12;
  if(stepUpPct===0){
    // closed form
    const fvFactor = ((Math.pow(1+r, months)-1)/r) * (1+r);
    return goal / fvFactor;
  }
  // binary search for step-up SIP
  let lo=1, hi=goal;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    const res = calcSIP(mid, rateAnnual, years, stepUpPct);
    if(res.valueTotal < goal) lo = mid; else hi = mid;
  }
  return hi;
}

/* ---------- Compute & Render ---------- */
function compute(){
  const s = state[currentTab];
  let result, rows = [], warn = '';

  if(currentTab==='sip'){
    const stepUp = s.stepupEnabled ? s.stepup : 0;
    result = calcSIP(s.monthly, s.rate, s.years, stepUp);
    rows = [
      {label:'Total invested', value: result.investedTotal, cls:''},
      {label:'Wealth gained', value: result.valueTotal - result.investedTotal, cls:'green'},
      {label:'Maturity value', value: result.valueTotal, cls:'', total:true}
    ];
  } else if(currentTab==='combo'){
    const stepUp = s.stepupEnabled ? s.stepup : 0;
    result = calcCombo(s.monthly, s.principal, s.rate, s.years, stepUp);
    rows = [
      {label:'Total invested', value: result.investedTotal, cls:''},
      {label:'From lumpsum', value: result.lumpValue, cls:''},
      {label:'From SIP', value: result.sipValue, cls:''},
      {label:'Wealth gained', value: result.valueTotal - result.investedTotal, cls:'green'},
      {label:'Maturity value', value: result.valueTotal, cls:'', total:true}
    ];
  } else if(currentTab==='lumpsum'){
    const topupAmt = s.topupEnabled ? s.topupAmount : 0;
    const topupStep = s.topupEnabled ? s.topupStepup : 0;
    result = calcLumpsum(s.principal, s.rate, s.years, topupAmt, topupStep);
    rows = [
      {label:'Amount invested', value: result.investedTotal, cls:''},
      {label:'Wealth gained', value: result.valueTotal - result.investedTotal, cls:'green'},
      {label:'Maturity value', value: result.valueTotal, cls:'', total:true}
    ];
  } else if(currentTab==='swp'){
    result = calcSWP(s.corpus, s.withdrawal, s.rate, s.years);
    rows = [
      {label:'Starting corpus', value: result.corpus, cls:''},
      {label:'Total withdrawn', value: result.investedTotal, cls:'rose'},
      {label:'Balance remaining', value: result.valueTotal, cls:'', total:true}
    ];
    if(result.depletedAt){
      const y = Math.ceil(result.depletedAt/12), m = result.depletedAt%12===0?12:result.depletedAt%12;
      warn = `Corpus is projected to run out around year ${y} (month ${m}) at this withdrawal rate.`;
    }
  } else if(currentTab==='goal'){
    const req = requiredSIPForGoal(s.goal, s.rate, s.years, s.stepup);
    result = calcSIP(req, s.rate, s.years, s.stepup);
    rows = [
      {label:'Required monthly SIP', value: req, cls:'green'},
      {label:'Total invested', value: result.investedTotal, cls:''},
      {label:'Target amount', value: s.goal, cls:'', total:true}
    ];
  }

  renderLedger(rows);
  renderWarn(warn);
  renderChart(result.yearly);
  renderTable(result.yearly, currentTab);

  if(inflationOn){
    const realVal = (rows.find(r=>r.total)?.value || 0) / Math.pow(1+inflationRate/100, s.years||1);
    document.getElementById('inflNote').textContent = `In today's money: ${fmtINR(realVal)} (adjusted for ${inflationRate}% inflation)`;
  }
}

function renderLedger(rows){
  const el = document.getElementById('ledgerRows');
  let html = '';
  rows.forEach(r=>{
    html += `<div class="row ${r.total?'total':''}">
      <span class="label">${r.label}</span><span class="dots"></span>
      <span class="amount ${r.cls}">${fmtINR(r.value)}</span>
    </div>`;
    if(r.total){
      html += `<div class="sub-note">${humanize(r.value)}</div>`;
      if(inflationOn) html += `<div class="sub-note" id="inflNote"></div>`;
    }
  });
  el.innerHTML = html;
}

function renderWarn(msg){
  document.getElementById('warnBox').innerHTML = msg ? `<div class="warn">${msg}</div>` : '';
}

function renderChart(yearly){
  const ctx = document.getElementById('growthChart');
  const labels = yearly.map(y=>'Y'+y.year);
  const invested = yearly.map(y=>y.invested);
  const value = yearly.map(y=>y.value);
  if(chart) chart.destroy();
  chart = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'Invested', data:invested, borderColor:'#C99A3D', backgroundColor:'rgba(201,154,61,0.12)', fill:true, tension:0.3, pointRadius:0, borderWidth:2},
        {label:'Value', data:value, borderColor:'#2F8F5B', backgroundColor:'rgba(47,143,91,0.14)', fill:true, tension:0.3, pointRadius:0, borderWidth:2}
      ]
    },
    options:{
      responsive:true,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(ctx)=> ctx.dataset.label+': '+fmtINR(ctx.parsed.y)}} },
      scales:{
        y:{ticks:{callback:(v)=> humanize(v)||v, font:{family:'IBM Plex Mono', size:10}}, grid:{color:'#eee6d3'}},
        x:{ticks:{font:{family:'IBM Plex Mono', size:10}}, grid:{display:false}}
      }
    }
  });
}

function renderTable(yearly, tab){
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  const col2 = tab==='swp' ? 'Withdrawn' : 'Invested';
  const col3 = tab==='swp' ? 'Balance' : 'Value';
  head.innerHTML = `<th>Year</th><th>${col2}</th><th>${col3}</th><th>Gain</th>`;
  body.innerHTML = yearly.map(y=>`
    <tr>
      <td>${y.year}</td>
      <td>${fmtINR(y.invested)}</td>
      <td>${fmtINR(y.value)}</td>
      <td>${fmtINR(y.value - y.invested)}</td>
    </tr>`).join('');
}

/* ---------- Tabs ---------- */
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===btn));
  renderInputs();
  compute();
});

/* ---------- Table toggle ---------- */
document.getElementById('toggleTable').addEventListener('click', (e)=>{
  const wrap = document.getElementById('tableWrap');
  wrap.classList.toggle('show');
  e.target.textContent = wrap.classList.contains('show') ? 'Hide year-wise ledger ▴' : 'Show year-wise ledger ▾';
});

/* ---------- Share ---------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
document.getElementById('shareBtn').addEventListener('click', ()=>{
  const s = state[currentTab];
  const params = new URLSearchParams();
  params.set('tab', currentTab);
  Object.keys(s).forEach(k=>params.set(k, typeof s[k]==='boolean' ? (s[k]?'1':'0') : s[k]));
  if(inflationOn){ params.set('infl','1'); params.set('inflRate', inflationRate); }
  const url = location.origin + location.pathname + '?' + params.toString();
  navigator.clipboard.writeText(url).then(()=> showToast('Link copied to clipboard')).catch(()=> showToast(url));
});

/* ---------- CSV ---------- */
document.getElementById('csvBtn').addEventListener('click', ()=>{
  const rows = [...document.querySelectorAll('#tableWrap table tr')].map(tr=>
    [...tr.children].map(td=>td.textContent).join(',')
  );
  const csv = rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `moneysutra-${currentTab}.csv`;
  a.click();
  showToast('CSV downloaded');
});

/* ---------- Date ---------- */
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();

/* ---------- Init ---------- */
initState();
document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===currentTab));
renderInputs();
compute();
</script>
